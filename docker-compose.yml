version: '3.8'

services:
  api:
    build: .
    container_name: aegis_ecogrid_api
    ports:
      - "8000:8000"
    command: uvicorn api.server:app --host 0.0.0.0 --port 8000
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL:-}
    restart: always

  dashboard:
    build: .
    container_name: aegis_ecogrid_dashboard
    ports:
      - "8501:8501"
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      - PORT=8501
      - DATABASE_URL=${DATABASE_URL:-}
    depends_on:
      - api
    restart: always
