name: ⚡ EcoGrid Core Industrial CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: 🐙 Checkout Code Repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 📦 Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🔍 Check Code Syntax Compilation
      run: |
        python -m py_compile app.py main.py api/server.py cloud_auditor.py

    - name: 🧪 Run Automated Pytest Suite
      run: |
        python -m pytest --maxfail=1 --disable-warnings
